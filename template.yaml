AWSTemplateFormatVersion: "2010-09-09"
Description: SaskAir Watch - Sprint 3 (ingestion, DynamoDB, REST API, dashboard website, SNS alerts, monitoring)

Parameters:
  ProjectName:
    Type: String
    Default: saskair-watch
  City:
    Type: String
    Default: Saskatoon
  Latitude:
    Type: String
    Default: "52.13"
  Longitude:
    Type: String
    Default: "-106.67"
  CodeBucket:
    Type: String
    Description: S3 bucket that holds the zipped Lambda code (uploaded by the pipeline)
  CodeKey:
    Type: String
    Description: S3 key of the zipped Ingest Lambda code, e.g. ingest-<commit>.zip
  QueryCodeKey:
    Type: String
    Description: S3 key of the zipped Query Lambda code, e.g. query-<commit>.zip
  AlertEmail:
    Type: String
    Default: ""
    Description: Optional. Your email address, subscribed to alerts automatically (you must confirm it).
  AqiLimit:
    Type: Number
    Default: 100
    Description: Send an alert when the US AQI goes above this
  ColdLimit:
    Type: Number
    Default: -30
    Description: Send an alert when the "feels like" temperature drops below this (C)
  ExistingRoleArn:
    Type: String
    Default: ""
    Description: >-
      Leave empty to create a new IAM role. If your AWS account cannot create
      IAM roles (for example AWS Academy Learner Lab), paste the LabRole ARN here.

Conditions:
  CreateRole: !Equals [!Ref ExistingRoleArn, ""]
  HasAlertEmail: !Not [!Equals [!Ref AlertEmail, ""]]

Resources:
  RawDataBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "${ProjectName}-raw-${AWS::AccountId}-${AWS::Region}"
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      Tags:
        - Key: Project
          Value: !Ref ProjectName

  ReadingsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${ProjectName}-readings"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: city
          AttributeType: S
        - AttributeName: timestamp
          AttributeType: S
      KeySchema:
        - AttributeName: city
          KeyType: HASH
        - AttributeName: timestamp
          KeyType: RANGE
      Tags:
        - Key: Project
          Value: !Ref ProjectName

  AlertTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub "${ProjectName}-alerts"
      DisplayName: SaskAir Watch

  OwnerAlertSubscription:
    Type: AWS::SNS::Subscription
    Condition: HasAlertEmail
    Properties:
      TopicArn: !Ref AlertTopic
      Protocol: email
      Endpoint: !Ref AlertEmail

  IngestFunctionRole:
    Type: AWS::IAM::Role
    Condition: CreateRole
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: WriteRawData
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: s3:PutObject
                Resource: !Sub "${RawDataBucket.Arn}/raw/*"
        - PolicyName: ReadWriteReadings
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:PutItem
                  - dynamodb:Query
                Resource: !GetAtt ReadingsTable.Arn
        - PolicyName: SendAlerts
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - sns:Publish
                  - sns:Subscribe
                Resource: !Ref AlertTopic

  IngestLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${ProjectName}-ingest"
      RetentionInDays: 14

  IngestFunction:
    Type: AWS::Lambda::Function
    DependsOn: IngestLogGroup
    Properties:
      FunctionName: !Sub "${ProjectName}-ingest"
      Description: Fetches weather and AQI from Open-Meteo every hour and saves raw JSON to S3
      Runtime: python3.12
      Handler: app.lambda_handler
      Code:
        S3Bucket: !Ref CodeBucket
        S3Key: !Ref CodeKey
      Timeout: 60
      MemorySize: 128
      Role: !If [CreateRole, !GetAtt IngestFunctionRole.Arn, !Ref ExistingRoleArn]
      Environment:
        Variables:
          RAW_BUCKET: !Ref RawDataBucket
          TABLE_NAME: !Ref ReadingsTable
          ALERT_TOPIC_ARN: !Ref AlertTopic
          AQI_LIMIT: !Ref AqiLimit
          COLD_LIMIT: !Ref ColdLimit
          CITY: !Ref City
          LATITUDE: !Ref Latitude
          LONGITUDE: !Ref Longitude
      Tags:
        - Key: Project
          Value: !Ref ProjectName

  HourlySchedule:
    Type: AWS::Events::Rule
    Properties:
      Name: !Sub "${ProjectName}-hourly"
      Description: Runs the Ingest Lambda every hour
      ScheduleExpression: rate(1 hour)
      State: ENABLED
      Targets:
        - Arn: !GetAtt IngestFunction.Arn
          Id: IngestFunctionTarget

  AllowEventBridgeToInvoke:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref IngestFunction
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt HourlySchedule.Arn

  IngestErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${ProjectName}-ingest-errors"
      AlarmDescription: The Ingest Lambda failed at least once in the last hour
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref IngestFunction
      Statistic: Sum
      Period: 3600
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlertTopic

  QueryLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${ProjectName}-query"
      RetentionInDays: 14

  QueryFunction:
    Type: AWS::Lambda::Function
    DependsOn: QueryLogGroup
    Properties:
      FunctionName: !Sub "${ProjectName}-query"
      Description: Returns the latest reading, hourly history and daily averages from DynamoDB
      Runtime: python3.12
      Handler: query_app.lambda_handler
      Code:
        S3Bucket: !Ref CodeBucket
        S3Key: !Ref QueryCodeKey
      Timeout: 15
      MemorySize: 128
      Role: !If [CreateRole, !GetAtt IngestFunctionRole.Arn, !Ref ExistingRoleArn]
      Environment:
        Variables:
          TABLE_NAME: !Ref ReadingsTable
          ALERT_TOPIC_ARN: !Ref AlertTopic
      Tags:
        - Key: Project
          Value: !Ref ProjectName

  RestApi:
    Type: AWS::ApiGateway::RestApi
    Properties:
      Name: !Sub "${ProjectName}-api"
      Description: SaskAir Watch REST API (/latest and /history)
      EndpointConfiguration:
        Types:
          - REGIONAL

  LatestResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref RestApi
      ParentId: !GetAtt RestApi.RootResourceId
      PathPart: latest

  HistoryResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref RestApi
      ParentId: !GetAtt RestApi.RootResourceId
      PathPart: history

  LatestMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref RestApi
      ResourceId: !Ref LatestResource
      HttpMethod: GET
      AuthorizationType: NONE
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub "arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${QueryFunction.Arn}/invocations"

  HistoryMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref RestApi
      ResourceId: !Ref HistoryResource
      HttpMethod: GET
      AuthorizationType: NONE
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub "arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${QueryFunction.Arn}/invocations"

  SubscribeResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref RestApi
      ParentId: !GetAtt RestApi.RootResourceId
      PathPart: subscribe

  SubscribeMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref RestApi
      ResourceId: !Ref SubscribeResource
      HttpMethod: POST
      AuthorizationType: NONE
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub "arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${QueryFunction.Arn}/invocations"

  # New logical ID so CloudFormation makes a fresh deployment that includes /subscribe
  ApiDeploymentV3:
    Type: AWS::ApiGateway::Deployment
    DependsOn:
      - LatestMethod
      - HistoryMethod
      - SubscribeMethod
    Properties:
      RestApiId: !Ref RestApi
      Description: Sprint 3 API deployment (/latest, /history, /subscribe)

  ApiStage:
    Type: AWS::ApiGateway::Stage
    Properties:
      RestApiId: !Ref RestApi
      DeploymentId: !Ref ApiDeploymentV3
      StageName: prod

  AllowApiGatewayToInvoke:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref QueryFunction
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${RestApi}/*/*/*"

  QueryErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${ProjectName}-query-errors"
      AlarmDescription: The Query Lambda failed at least once in the last hour
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref QueryFunction
      Statistic: Sum
      Period: 3600
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlertTopic

  MissedRunAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${ProjectName}-missed-hourly-run"
      AlarmDescription: The Ingest Lambda has not run for 2 hours (the hourly schedule may be broken)
      Namespace: AWS/Lambda
      MetricName: Invocations
      Dimensions:
        - Name: FunctionName
          Value: !Ref IngestFunction
      Statistic: Sum
      Period: 3600
      EvaluationPeriods: 2
      Threshold: 1
      ComparisonOperator: LessThanThreshold
      TreatMissingData: breaching
      AlarmActions:
        - !Ref AlertTopic

  WebsiteBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "${ProjectName}-site-${AWS::AccountId}-${AWS::Region}"
      WebsiteConfiguration:
        IndexDocument: index.html
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        IgnorePublicAcls: true
        BlockPublicPolicy: false
        RestrictPublicBuckets: false
      Tags:
        - Key: Project
          Value: !Ref ProjectName

  WebsiteBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref WebsiteBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: PublicReadForDashboard
            Effect: Allow
            Principal: "*"
            Action: s3:GetObject
            Resource: !Sub "${WebsiteBucket.Arn}/*"

  MonitoringDashboard:
    Type: AWS::CloudWatch::Dashboard
    Properties:
      DashboardName: !Sub "${ProjectName}-monitoring"
      DashboardBody: !Sub |
        {
          "widgets": [
            {"type": "metric", "x": 0, "y": 0, "width": 12, "height": 6,
             "properties": {"title": "Ingest Lambda: runs and errors (should run every hour)", "region": "${AWS::Region}", "stat": "Sum", "period": 3600, "view": "timeSeries",
               "metrics": [["AWS/Lambda", "Invocations", "FunctionName", "${IngestFunction}"], [".", "Errors", ".", "."]]}},
            {"type": "metric", "x": 12, "y": 0, "width": 12, "height": 6,
             "properties": {"title": "Ingest Lambda: duration (ms)", "region": "${AWS::Region}", "stat": "Average", "period": 3600, "view": "timeSeries",
               "metrics": [["AWS/Lambda", "Duration", "FunctionName", "${IngestFunction}"]]}},
            {"type": "metric", "x": 0, "y": 6, "width": 12, "height": 6,
             "properties": {"title": "API: requests and errors", "region": "${AWS::Region}", "stat": "Sum", "period": 300, "view": "timeSeries",
               "metrics": [["AWS/ApiGateway", "Count", "ApiName", "${ProjectName}-api"], [".", "4XXError", ".", "."], [".", "5XXError", ".", "."]]}},
            {"type": "metric", "x": 12, "y": 6, "width": 12, "height": 6,
             "properties": {"title": "API: latency (ms)", "region": "${AWS::Region}", "stat": "Average", "period": 300, "view": "timeSeries",
               "metrics": [["AWS/ApiGateway", "Latency", "ApiName", "${ProjectName}-api"]]}},
            {"type": "alarm", "x": 0, "y": 12, "width": 24, "height": 3,
             "properties": {"title": "Alarms", "alarms": ["${IngestErrorAlarm.Arn}", "${QueryErrorAlarm.Arn}", "${MissedRunAlarm.Arn}"]}}
          ]
        }

Outputs:
  RawDataBucketName:
    Value: !Ref RawDataBucket
  IngestFunctionName:
    Value: !Ref IngestFunction
  ScheduleRule:
    Value: !Ref HourlySchedule
  ReadingsTableName:
    Value: !Ref ReadingsTable
  QueryFunctionName:
    Value: !Ref QueryFunction
  WebsiteUrl:
    Description: The public dashboard website
    Value: !GetAtt WebsiteBucket.WebsiteURL
  WebsiteBucketName:
    Value: !Ref WebsiteBucket
  AlertTopicArn:
    Value: !Ref AlertTopic
  MonitoringDashboardUrl:
    Value: !Sub "https://${AWS::Region}.console.aws.amazon.com/cloudwatch/home?region=${AWS::Region}#dashboards:name=${ProjectName}-monitoring"
  ApiUrl:
    Description: Base URL of the REST API
    Value: !Sub "https://${RestApi}.execute-api.${AWS::Region}.amazonaws.com/prod"
