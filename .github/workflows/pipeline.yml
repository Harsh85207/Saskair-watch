name: SaskAir Watch CI/CD

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
  STACK_NAME: saskair-watch
  ARTIFACT_BUCKET: ${{ vars.ARTIFACT_BUCKET }}

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test tools
        run: pip install -r requirements-dev.txt

      - name: Run unit tests
        run: pytest -v

      - name: Check CloudFormation template
        run: cfn-lint template.yaml

  deploy:
    name: Deploy to AWS
    needs: test
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Make sure the artifact bucket exists
        run: |
          aws s3api head-bucket --bucket "$ARTIFACT_BUCKET" 2>/dev/null \
            || aws s3 mb "s3://$ARTIFACT_BUCKET" --region "$AWS_REGION"

      - name: Package Lambda code
        run: |
          (cd src/ingest && zip -r ../../ingest.zip . -x "__pycache__/*")
          (cd src/query && zip -r ../../query.zip . -x "__pycache__/*")
          aws s3 cp ingest.zip "s3://$ARTIFACT_BUCKET/ingest-${{ github.sha }}.zip"
          aws s3 cp query.zip "s3://$ARTIFACT_BUCKET/query-${{ github.sha }}.zip"

      - name: Deploy CloudFormation stack
        run: |
          aws cloudformation deploy \
            --template-file template.yaml \
            --stack-name "$STACK_NAME" \
            --capabilities CAPABILITY_IAM \
            --no-fail-on-empty-changeset \
            --parameter-overrides \
              CodeBucket="$ARTIFACT_BUCKET" \
              CodeKey="ingest-${{ github.sha }}.zip" \
              QueryCodeKey="query-${{ github.sha }}.zip" \
              ExistingRoleArn="${{ vars.EXISTING_ROLE_ARN }}" \
              AlertEmail="${{ vars.ALERT_EMAIL }}"

      - name: Smoke test - run the Ingest Lambda once
        run: |
          aws lambda invoke --function-name saskair-watch-ingest out.json
          cat out.json
          grep -q '"statusCode": 200' out.json

      - name: API tests - call the live REST API
        run: |
          API_URL=$(aws cloudformation describe-stacks --stack-name "$STACK_NAME" \
            --query "Stacks[0].Outputs[?OutputKey=='ApiUrl'].OutputValue" --output text)
          echo "API URL: $API_URL"
          python3 scripts/check_api.py "$API_URL"

      - name: Publish the dashboard website
        run: |
          out() { aws cloudformation describe-stacks --stack-name "$STACK_NAME" \
            --query "Stacks[0].Outputs[?OutputKey=='$1'].OutputValue" --output text; }
          API_URL=$(out ApiUrl)
          SITE_BUCKET=$(out WebsiteBucketName)
          echo "window.SASKAIR_CONFIG = { apiUrl: \"$API_URL\" };" > site/config.js
          aws s3 sync site/ "s3://$SITE_BUCKET/" --delete --cache-control "max-age=300"
          echo "WEBSITE_URL=$(out WebsiteUrl)" >> "$GITHUB_ENV"

      - name: Website test - the dashboard is online
        run: |
          echo "Dashboard: $WEBSITE_URL"
          curl -sSf "$WEBSITE_URL" | grep -q "SaskAir Watch"
          curl -sSf "$WEBSITE_URL/config.js" | grep -q "execute-api"
          echo "PASS dashboard is online and points at the API"
