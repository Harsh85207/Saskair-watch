name: SaskAir Watch CI/CD

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
  STACK_NAME: saskair-watch
  ARTIFACT_BUCKET: ${{ vars.ARTIFACT_BUCKET }}

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test tools
        run: pip install -r requirements-dev.txt

      - name: Run unit tests
        run: pytest -v

      - name: Check CloudFormation template
        run: cfn-lint template.yaml

  deploy:
    name: Deploy to AWS
    needs: test
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Make sure the artifact bucket exists
        run: |
          aws s3api head-bucket --bucket "$ARTIFACT_BUCKET" 2>/dev/null \
            || aws s3 mb "s3://$ARTIFACT_BUCKET" --region "$AWS_REGION"

      - name: Package Lambda code
        run: |
          cd src/ingest && zip -r ../../ingest.zip . -x "__pycache__/*" && cd ../..
          aws s3 cp ingest.zip "s3://$ARTIFACT_BUCKET/ingest-${{ github.sha }}.zip"

      - name: Deploy CloudFormation stack
        run: |
          aws cloudformation deploy \
            --template-file template.yaml \
            --stack-name "$STACK_NAME" \
            --capabilities CAPABILITY_IAM \
            --no-fail-on-empty-changeset \
            --parameter-overrides \
              CodeBucket="$ARTIFACT_BUCKET" \
              CodeKey="ingest-${{ github.sha }}.zip" \
              ExistingRoleArn="${{ vars.EXISTING_ROLE_ARN }}"

      - name: Smoke test - run the Lambda once
        run: |
          aws lambda invoke --function-name saskair-watch-ingest out.json
          cat out.json
          grep -q '"statusCode": 200' out.json
